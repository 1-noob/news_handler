[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "news-handler"
version = "0.1.0"
description = "Fetches news articles, classifies them, stores them in a database, and manages review workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Shiv" }
]

dependencies = [
    "requests>=2.31.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.2",
    "lxml>=5.1.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

dev = [
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
]


[tool.setuptools]
packages = ["subroutines"]


[tool.black]
line-length = 88
target-version = ["py310"]


[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
ignore = ["E501"]


[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
